    <script>
      // Las direcciones viejas del panel llevan a la de CountÜp.
      if (['contabol.github.io', 'gabrieldrawgames-jpg.github.io'].indexOf(location.hostname) !== -1) location.replace('https://countup-app.github.io/app/ceo.html')
      // CountÜp 2.0.54: lo guardado en este equipo pasa de "contabol:…" a "countup:…". Se copia una sola vez y lo viejo
      // no se borra (si una actualización fallara y la app volviera a la versión anterior, lo encuentra donde estaba).
      try {
        if (!localStorage.getItem('countup:copiado')) {
          var viejas = []
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('contabol:') === 0) viejas.push(k) }
          viejas.forEach(function (k) { var n = 'countup:' + k.slice(9); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)) })
          localStorage.setItem('countup:copiado', '1')
        }
      } catch (e) {}
      try {
        // La apariencia elegida en el panel; si no hay, la de la app.
        var doc = JSON.parse(localStorage.getItem('countup:v1') || 'null')
        var theme = localStorage.getItem('countup:v2:ceo-tema') || (doc && doc.settings && doc.settings.theme) || 'system'
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
