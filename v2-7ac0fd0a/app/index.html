    <title>CountÜp</title>
    <script>
      // CountÜp 2.0.54: lo guardado en este equipo pasa de "contabol:…" a "countup:…". Se copia una sola vez y lo viejo
      // no se borra (si una actualización fallara y la app volviera a la versión anterior, lo encuentra donde estaba).
      try {
        if (!localStorage.getItem('countup:copiado')) {
          var viejas = []
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('contabol:') === 0) viejas.push(k) }
          viejas.forEach(function (k) { var n = 'countup:' + k.slice(9); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)) })
          localStorage.setItem('countup:copiado', '1')
        }
      } catch (e) {}
      // El modo (claro u oscuro) se pone antes de dibujar nada, así la app abre directo en el que corresponde.
      // V2: una sola vez, cada equipo vuelve a "Automático" (el modo del teléfono o la PC); después se respeta lo que elija.
      try {
        var doc = JSON.parse(localStorage.getItem('countup:v1') || 'null')
        if (!localStorage.getItem('countup:v2:tema-auto')) {
          if (doc && doc.settings && doc.settings.theme && doc.settings.theme !== 'system') {
            doc.settings.theme = 'system'
            localStorage.setItem('countup:v1', JSON.stringify(doc))
          }
          localStorage.setItem('countup:v2:tema-auto', '1')
        }
        var theme = (doc && doc.settings && doc.settings.theme) || 'system'
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>

content:"";background:#3d8bff;border-radius:50%;animation:2.3s linear both arr-azul;position:absolute;inset:0}@keyframes arr-azul{0%,4%{opacity:1}24%,to{opacity:0}}#arranque .l{animation-name:arr-l}#arranque .r{animation-name:arr-r}#arranque .m{animation-name:arr-m}@keyframes arr-l{0%,2%{opacity:0;transform:translate(-28px,16px)}4%{opacity:1}40%{animation-timing-function:cubic-bezier(.2,.7,.3,1);transform:translate(-28px,16px)}52%,to{opacity:1;transform:translate(-62px,96px)}}@keyframes arr-r{0%,2%{opacity:0;transform:translate(28px,16px)}4%{opacity:1}40%{animation-timing-function:cubic-bezier(.2,.7,.3,1);transform:translate(28px,16px)}52%,to{opacity:1;transform:translate(62px,96px)}}@keyframes arr-m{0%,2%{opacity:0;transform:translateY(-32px)}4%{opacity:1}40%{animation-timing-function:cubic-bezier(.2,.7,.3,1);transform:translateY(-32px)}52%{transform:translate(-62px,-208px)}61%{animation-timing-function:cubic-bezier(.55,0,1,.6);transform:translate(-62px,-208px)}78%{opacity:1;transform:translate(-78px,174px)}81%,to{opacity:0;transform:translate(-78px,174px)}}@media (prefers-reduced-motion:reduce){#arranque .p,#arranque .p:after,#arranque .tapa,#arranque .grupo,#arranque .giro{animation:none}#arranque .tapa,#arranque .m,#arranque .p:after{display:none}#arranque .grupo{transform:translate(256px,40px)}#arranque .l{transform:translate(-62px,96px)}#arranque .r{transform:translate(62px,96px)}}</style>

    <div id="arranque" aria-hidden="true">
      <div class="lienzo">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="arr-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c21bff" /><stop offset="1" stop-color="#7a5cff" /></linearGradient></defs>

    <script>
      // Se va a los 2,45 s (o enseguida con "reducir movimiento") desvaneciéndose; la app ya cargó por detrás.
      (function () {
        var el = document.getElementById('arranque')
        // Tamaño del logo: 62 % del ancho de la pantalla, como mucho 280 px (el lienzo mide 512).
        el.style.setProperty('--k', Math.min(innerWidth * 0.62, 280) / 512)
        // La ventanita de "Continuar con Google" (vuelve a esta página) no lleva animación.
        if (/state=popup/.test(location.hash + location.search)) { el.remove(); return }
        var quieta = matchMedia('(prefers-reduced-motion: reduce)').matches
        setTimeout(function () { el.classList.add('sale'); setTimeout(function () { el.remove() }, 400) }, quieta ? 700 : 2450)
      })()
    </script>
