    <title>CountÜp</title>
    <script>
      // CountÜp 2.0.54: lo guardado en este equipo pasa de "contabol:…" a "countup:…". Se copia una sola vez y lo viejo
      // no se borra (si una actualización fallara y la app volviera a la versión anterior, lo encuentra donde estaba).
      try {
        if (!localStorage.getItem('countup:copiado')) {
          var viejas = []
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('contabol:') === 0) viejas.push(k) }
          viejas.forEach(function (k) { var n = 'countup:' + k.slice(9); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)) })
          localStorage.setItem('countup:copiado', '1')
        }
      } catch (e) {}
      // El modo (claro u oscuro) se pone antes de dibujar nada, así la app abre directo en el que corresponde.
      // V2: una sola vez, cada equipo vuelve a "Automático" (el modo del teléfono o la PC); después se respeta lo que elija.
      try {
        var doc = JSON.parse(localStorage.getItem('countup:v1') || 'null')
        if (!localStorage.getItem('countup:v2:tema-auto')) {
          if (doc && doc.settings && doc.settings.theme && doc.settings.theme !== 'system') {
            doc.settings.theme = 'system'
            localStorage.setItem('countup:v1', JSON.stringify(doc))
          }
          localStorage.setItem('countup:v2:tema-auto', '1')
        }
        var theme = (doc && doc.settings && doc.settings.theme) || 'system'
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
    <style>#arranque{--bg:#0b0d11;z-index:9999;background:var(--bg);place-items:center;transition:opacity .36s;display:grid;position:fixed;inset:0;overflow:hidden}:root[data-theme=light] #arranque{--bg:#f3f4f6}#arranque.sale{opacity:0;pointer-events:none}#arranque .lienzo{width:512px;height:512px;transform:scale(var(--k,.5));margin:-256px 0 0 -256px;position:absolute;top:50%;left:50%}#arranque .lienzo>*{position:absolute}#arranque svg{filter:drop-shadow(0 0 14px #be3cff73);width:512px;height:512px;inset:0;overflow:visible}#arranque .tapa{background:var(--bg);will-change:transform;animation:none}#arranque .t1{transform-origin:50% 100%;width:100px;height:142px;animation-name:arr-t1;top:160px;left:128px}#arranque .t2{transform-origin:100%;width:256px;height:148px;animation-name:arr-t2;top:296px;left:128px}#arranque .t3{transform-origin:50% 0;width:100px;height:142px;animation-name:arr-t3;top:160px;left:284px}@keyframes arr-t1{0%,60%{transform:scaleY(1)}67%,to{transform:scaleY(0)}}@keyframes arr-t2{0%,66%{transform:scaleX(1)}75%,to{transform:scaleX(0)}}@keyframes arr-t3{0%,74%{transform:scaleY(1)}81%,to{transform:scaleY(0)}}#arranque .p{will-change:transform, opacity;background:#c21bff;border-radius:50%;width:54px;height:54px;animation:none;top:-27px;left:-27px;box-shadow:0 0 18px #c21bff80}#arranque .p:after{content:"";background:#3d8bff;border-radius:50%;animation:2.1s linear both arr-azul;position:absolute;inset:0}@keyframes arr-azul{0%,6%{opacity:1}30%,to{opacity:0}}#arranque .a{animation-name:arr-a}#arranque .b{animation-name:arr-b}#arranque .c{animation-name:arr-c}@keyframes arr-a{0%{opacity:0;transform:translate(60px,860px)}6%{opacity:1}18%{transform:translate(150px,520px)}30%{transform:translate(236px,176px)}44%,to{opacity:1;transform:translate(194px,136px)}}@keyframes arr-b{0%{opacity:0;transform:translate(116px,880px)}6%{opacity:1}18%{transform:translate(196px,500px)}30%{transform:translate(276px,150px)}44%,to{opacity:1;transform:translate(318px,136px)}}@keyframes arr-c{0%{opacity:0;transform:translate(80px,920px)}6%{opacity:1}18%{transform:translate(176px,560px)}30%{animation-timing-function:cubic-bezier(.2,.6,.4,1);transform:translate(250px,200px)}40%{animation-timing-function:cubic-bezier(.6,0,.9,.5);transform:translate(230px,-720px)}60%{opacity:1;transform:translate(178px,214px)}64%,to{opacity:0;transform:translate(178px,214px)}}@media (prefers-reduced-motion:reduce){#arranque .p,#arranque .p:after,#arranque .tapa{animation:none}#arranque .tapa,#arranque .c,#arranque .p:after{display:none}#arranque .a{transform:translate(194px,136px)}#arranque .b{transform:translate(318px,136px)}}</style>

  <body>
    <div id="arranque" aria-hidden="true">
      <div class="lienzo">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="arr-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c21bff" /><stop offset="1" stop-color="#7a5cff" /></linearGradient></defs>
          <path d="M178 214 V296 C178 352 210 388 256 388 C302 388 334 352 334 296 V214" fill="none" stroke="url(#arr-g)" stroke-width="50" stroke-linecap="round" />
        </svg>
        <i class="tapa t1"></i><i class="tapa t2"></i><i class="tapa t3"></i>
        <i class="p a"></i><i class="p b"></i><i class="p c" style="left:-25px;top:-25px;width:50px;height:50px"></i>
      </div>
    </div>
    <script>
      // Se va a los 2,1 s (o enseguida con "reducir movimiento") desvaneciéndose; la app ya cargó por detrás.
      (function () {
        var el = document.getElementById('arranque')
        // Tamaño del logo: 62 % del ancho de la pantalla, como mucho 280 px (el lienzo mide 512).
        el.style.setProperty('--k', Math.min(innerWidth * 0.62, 280) / 512)
        // La ventanita de "Continuar con Google" (vuelve a esta página) no lleva animación.
        if (/state=popup/.test(location.hash + location.search)) { el.remove(); return }
        var quieta = matchMedia('(prefers-reduced-motion: reduce)').matches
        setTimeout(function () { el.classList.add('sale'); setTimeout(function () { el.remove() }, 400) }, quieta ? 700 : 2100)
      })()
    </script>
    <div id="root"></div>
