    <title>CountÜp</title>
    <script>
      // CountÜp 2.0.54: lo guardado en este equipo pasa de "contabol:…" a "countup:…". Se copia una sola vez y lo viejo
      // no se borra (si una actualización fallara y la app volviera a la versión anterior, lo encuentra donde estaba).
      try {
        if (!localStorage.getItem('countup:copiado')) {
          var viejas = []
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('contabol:') === 0) viejas.push(k) }
          viejas.forEach(function (k) { var n = 'countup:' + k.slice(9); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)) })
          localStorage.setItem('countup:copiado', '1')
        }
      } catch (e) {}
      // El modo (claro u oscuro) se pone antes de dibujar nada, así la app abre directo en el que corresponde.
      // V2: una sola vez, cada equipo vuelve a "Automático" (el modo del teléfono o la PC); después se respeta lo que elija.
      try {
        var doc = JSON.parse(localStorage.getItem('countup:v1') || 'null')
        if (!localStorage.getItem('countup:v2:tema-auto')) {
          if (doc && doc.settings && doc.settings.theme && doc.settings.theme !== 'system') {
            doc.settings.theme = 'system'
            localStorage.setItem('countup:v1', JSON.stringify(doc))
          }
          localStorage.setItem('countup:v2:tema-auto', '1')
        }
        var theme = (doc && doc.settings && doc.settings.theme) || 'system'
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
    <style>#arranque{z-index:9999;background:#0b0d11;place-items:center;transition:opacity .36s;display:grid;position:fixed;inset:0}:root[data-theme=light] #arranque{background:#f3f4f6}#arranque.sale{opacity:0;pointer-events:none}#arranque svg{filter:drop-shadow(0 0 14px #be3cff73);width:min(62vw,280px);height:auto;overflow:visible}#arranque .p{fill:#3d8bff;animation:none}#arranque .a{animation-name:arr-a}#arranque .b{animation-name:arr-b}#arranque .c{animation-name:arr-c}#arranque .u{stroke-dasharray:1;stroke-dashoffset:1px;animation:2.1s cubic-bezier(.55,0,.25,1) both arr-u}@keyframes arr-a{0%{opacity:0;fill:#3d8bff;transform:translate(60px,860px)}6%{opacity:1}18%{transform:translate(150px,520px)}30%{fill:#c21bff;transform:translate(236px,176px)}44%,to{fill:#c21bff;transform:translate(194px,136px)}}@keyframes arr-b{0%{opacity:0;fill:#3d8bff;transform:translate(116px,880px)}6%{opacity:1}18%{transform:translate(196px,500px)}30%{fill:#c21bff;transform:translate(276px,150px)}44%,to{fill:#c21bff;transform:translate(318px,136px)}}@keyframes arr-c{0%{opacity:0;fill:#3d8bff;transform:translate(80px,920px)}6%{opacity:1}18%{transform:translate(176px,560px)}30%{fill:#c21bff;animation-timing-function:cubic-bezier(.2,.6,.4,1);transform:translate(250px,200px)}40%{animation-timing-function:cubic-bezier(.6,0,.9,.5);transform:translate(230px,-720px)}60%{opacity:1;fill:#c21bff;transform:translate(178px,214px)}63%,to{opacity:0;fill:#c21bff;transform:translate(178px,214px)}}@keyframes arr-u{0%,59%{stroke-dashoffset:1px;opacity:0}60%{opacity:1}80%,to{stroke-dashoffset:0;opacity:1}}@media (prefers-reduced-motion:reduce){#arranque .p,#arranque .u{animation:none}#arranque .u{stroke-dashoffset:0}#arranque .c{opacity:0}#arranque .a{fill:#c21bff;transform:translate(194px,136px)}#arranque .b{fill:#c21bff;transform:translate(318px,136px)}}</style>

    <script>
      // Se va a los 2,1 s (o enseguida con "reducir movimiento") desvaneciéndose; la app ya cargó por detrás.
      (function () {
        var el = document.getElementById('arranque')
        // La ventanita de "Continuar con Google" (vuelve a esta página) no lleva animación.
        if (/state=popup/.test(location.hash + location.search)) { el.remove(); return }
        var quieta = matchMedia('(prefers-reduced-motion: reduce)').matches
        setTimeout(function () { el.classList.add('sale'); setTimeout(function () { el.remove() }, 400) }, quieta ? 700 : 2100)
      })()
    </script>
