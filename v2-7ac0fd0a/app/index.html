    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Contabilidad de tu negocio en bolívares, con el resultado en dólares a la tasa BCV." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Contábol</title>
    <script>
      // El modo (claro u oscuro) se pone antes de dibujar nada, así la app abre directo en el que corresponde.
      // V2: una sola vez, cada equipo vuelve a "Automático" (el modo del teléfono o la PC); después se respeta lo que elija.
      try {
        var doc = JSON.parse(localStorage.getItem('contabol:v1') || 'null')
        if (!localStorage.getItem('contabol:v2:tema-auto')) {
          if (doc && doc.settings && doc.settings.theme && doc.settings.theme !== 'system') {
            doc.settings.theme = 'system'
            localStorage.setItem('contabol:v1', JSON.stringify(doc))
          }
          localStorage.setItem('contabol:v2:tema-auto', '1')
        }
        var theme = (doc && doc.settings && doc.settings.theme) || 'system'
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
