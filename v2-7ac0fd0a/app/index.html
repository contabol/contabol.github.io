<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Contabilidad de tu negocio en bolívares, con el resultado en dólares a la tasa BCV." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>CountÜp</title>
    <script>
      // CountÜp 2.0.54: lo guardado en este equipo pasa de "contabol:…" a "countup:…". Se copia una sola vez y lo viejo
      // no se borra (si una actualización fallara y la app volviera a la versión anterior, lo encuentra donde estaba).
      try {
        if (!localStorage.getItem('countup:copiado')) {
          var viejas = []
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('contabol:') === 0) viejas.push(k) }
          viejas.forEach(function (k) { var n = 'countup:' + k.slice(9); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)) })
          localStorage.setItem('countup:copiado', '1')
        }
      } catch (e) {}
      // El modo (claro u oscuro) se pone antes de dibujar nada, así la app abre directo en el que corresponde.
      // V2: una sola vez, cada equipo vuelve a "Automático" (el modo del teléfono o la PC); después se respeta lo que elija.
      try {
        var doc = JSON.parse(localStorage.getItem('countup:v1') || 'null')
        if (!localStorage.getItem('countup:v2:tema-auto')) {
          if (doc && doc.settings && doc.settings.theme && doc.settings.theme !== 'system') {
            doc.settings.theme = 'system'
            localStorage.setItem('countup:v1', JSON.stringify(doc))
          }
          localStorage.setItem('countup:v2:tema-auto', '1')
        }
        var theme = (doc && doc.settings && doc.settings.theme) || 'system'
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
    <style>#arranque{z-index:9999;background:#000;transition:opacity .36s;position:fixed;inset:0}:root[data-theme=light] #arranque{background:#fff}#arranque video{object-fit:contain;opacity:0;background:0 0;width:100%;height:100%;display:block}#arranque.va video{opacity:1}html.arrancando,html.arrancando body{overflow:hidden!important}#arranque.sale{opacity:0;pointer-events:none}</style>
    <script type="module" crossorigin src="./assets/main-jsskDSqu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-B0Z9INg1.js">
    <link rel="modulepreload" crossorigin href="./assets/jsx-runtime-DpJIb57s.js">
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-BX4tuJAM.js">
    <link rel="modulepreload" crossorigin href="./assets/dist-dUlp0iFe.js">
    <link rel="stylesheet" crossorigin href="./assets/preload-helper-B_VMY_PD.css">
    <link rel="stylesheet" crossorigin href="./assets/main-B7Ewdhnu.css">
  </head>
  <body>
    <div id="arranque" aria-hidden="true"><video muted playsinline preload="auto" disablepictureinpicture poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video></div>
    <script>
      // Se va al terminar el video, desvaneciéndose (la app ya cargó por detrás). Si el video no puede reproducirse,
      // se va enseguida; y como mucho a los 6 s.
      (function () {
        var el = document.getElementById('arranque')
        // La ventanita de "Continuar con Google" (vuelve a esta página) no lleva animación.
        if (/state=popup/.test(location.hash + location.search)) { el.remove(); return }
        var v = el.querySelector('video'), done = false, raiz = document.documentElement
        raiz.classList.add('arrancando')
        var fin = function () { if (done) return; done = true; el.classList.add('sale'); setTimeout(function () { el.remove(); raiz.classList.remove('arrancando') }, 400) }
        v.addEventListener('playing', function () { el.classList.add('va') })
        v.src = document.documentElement.getAttribute('data-theme') === 'light' ? './arranque/claro.mp4' : './arranque/oscuro.mp4'
        v.addEventListener('ended', fin)
        v.addEventListener('error', fin)
        var p = v.play()
        if (p && p.catch) p.catch(fin)
        setTimeout(fin, 6000)
      })()
    </script>
    <div id="root"></div>
  </body>
</html>
